[defaults]
# Default inventory lives in the per-user workspace, not the repo.
inventory = ~/.rankez-upgrade/inventory

# Host key checking: accept-new for first contact (override with --insecure-ssh).
host_key_checking = True

# Never write .retry files into the working tree.
retry_files_enabled = False

# Human-readable output.
stdout_callback = yaml

# Per-user logs in the workspace.
log_path = ~/.rankez-upgrade/logs/ansible.log

[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s