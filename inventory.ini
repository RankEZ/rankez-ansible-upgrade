# Automatically generated RankEZ upgrade inventory

[primary_vault]
192.168.0.11 ansible_user=cloud-user

[standby_vault]
192.168.0.12 ansible_user=cloud-user

[vaults:children]
primary_vault
standby_vault

[pac]
192.168.0.21 ansible_user=cloud-user

[psm]
192.168.0.21 ansible_user=cloud-user

[cpm]
192.168.0.21 ansible_user=cloud-user

[cp]
192.168.0.21 ansible_user=cloud-user

[frontend:children]
pac
psm
cpm
cp

[all:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_become=yes
upgrade_version=5.9.0
local_bundle_dir=./onebox-offline-rhel-v5.9.0/packages
remote_tmp_dir=/tmp/rankez_upgrade
