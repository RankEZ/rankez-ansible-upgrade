---
- name: Check Docker version
  command: docker --version
  register: docker_version_output
  changed_when: false

- name: Parse Docker version
  set_fact:
    docker_version: "{{ docker_version_output.stdout | regex_search('Docker version ([0-9]+)', '\\1') | first }}"

- name: Fail if Docker version is less than 26
  fail:
    msg: "Docker version is {{ docker_version }}, which is less than 26. Please upgrade Docker first."
  when: docker_version | int < 26

- name: Check Docker Buildx availability
  command: docker buildx version
  register: docker_buildx_output
  changed_when: false
  failed_when: false
  when: inventory_hostname in groups.get('vaults', []) or inventory_hostname in groups.get('frontend', [])

- name: Fail if Docker Buildx is unavailable
  fail:
    msg: "Docker Buildx is required for RankEZ upgrades but 'docker buildx version' failed. Install the Docker Buildx plugin before continuing."
  when:
    - inventory_hostname in groups.get('vaults', []) or inventory_hostname in groups.get('frontend', [])
    - docker_buildx_output.rc != 0

- name: Check Docker Compose availability
  command: docker compose version
  register: docker_compose_output
  changed_when: false
  failed_when: false

- name: Fail if Docker Compose is unavailable
  fail:
    msg: "Docker Compose plugin is required by the upgrade automation but 'docker compose version' failed. Install the Docker Compose plugin before continuing."
  when: docker_compose_output.rc != 0

- name: Check if dr-manager is running
  command: docker ps -q --filter "name=dr-manager"
  register: dr_manager_status
  changed_when: false

- name: Stop dr-manager for VM snapshots
  command: docker stop dr-manager
  when: dr_manager_status.stdout != ""
  ignore_errors: true

- name: Pause for VM snapshot
  pause:
    prompt: "dr-manager has been stopped. Please take a VM snapshot now. Press Enter to continue..."
  when: dr_manager_status.stdout != ""
