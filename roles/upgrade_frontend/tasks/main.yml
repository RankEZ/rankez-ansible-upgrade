---
- name: Upgrade PAC Component
  block:
    - name: Extract PAC package
      unarchive:
        src: "{{ remote_tmp_dir }}/pam-pac-{{ upgrade_version }}.tar.gz"
        dest: "{{ remote_tmp_dir }}"
        remote_src: yes
    - name: Set PAC installation path in install.conf
      lineinfile:
        path: "{{ remote_tmp_dir }}/pam-pac-{{ upgrade_version }}/install.conf"
        regexp: '^INSTALL_PATH='
        line: "INSTALL_PATH={{ install_path | default('/opt') }}"
        backup: yes
    - name: Run PAC upgrade script
      command: bash upgrade.sh
      args:
        chdir: "{{ remote_tmp_dir }}/pam-pac-{{ upgrade_version }}"
      register: pac_upgrade_result
      failed_when: 
        - pac_upgrade_result.rc != 0
        - "'already version' not in pac_upgrade_result.stdout"
    - name: Debug PAC upgrade output
      debug:
        var: pac_upgrade_result.stdout_lines
  when: inventory_hostname in groups.get('pac', [])

- name: Upgrade PSM Component
  block:
    - name: Extract PSM package
      unarchive:
        src: "{{ remote_tmp_dir }}/pam-psm-{{ upgrade_version }}.tar.gz"
        dest: "{{ remote_tmp_dir }}"
        remote_src: yes
    - name: Set PSM installation path in install.conf
      lineinfile:
        path: "{{ remote_tmp_dir }}/pam-psm-{{ upgrade_version }}/install.conf"
        regexp: '^INSTALL_PATH='
        line: "INSTALL_PATH={{ install_path | default('/opt') }}"
        backup: yes
    - name: Run PSM upgrade script (Long timeout for Docker image loading)
      command: bash upgrade.sh
      args:
        chdir: "{{ remote_tmp_dir }}/pam-psm-{{ upgrade_version }}"
      async: 1200
      poll: 30
      register: psm_upgrade_result
      failed_when: 
        - psm_upgrade_result.rc != 0
        - "'already version' not in psm_upgrade_result.stdout"
    - name: Debug PSM upgrade output
      debug:
        var: psm_upgrade_result.stdout_lines
  when: inventory_hostname in groups.get('psm', [])

