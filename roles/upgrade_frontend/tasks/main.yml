        remote_src: yes
    - name: Set CPM installation path in install.conf
      lineinfile:
        path: "{{ remote_tmp_dir }}/pam-cpm-{{ upgrade_version }}/install.conf"
        regexp: '^INSTALL_PATH='
        line: "INSTALL_PATH={{ install_path | default('/opt') }}"
        backup: yes
    - name: Run CPM upgrade script
      command: bash upgrade.sh
      args:
        chdir: "{{ remote_tmp_dir }}/pam-cpm-{{ upgrade_version }}"
      register: cpm_upgrade_result
      failed_when: 
        - cpm_upgrade_result.rc != 0
        - "'already version' not in cpm_upgrade_result.stdout"
    - name: Debug CPM upgrade output
      debug:
        var: cpm_upgrade_result.stdout_lines
  when: inventory_hostname in groups.get('cpm', [])
